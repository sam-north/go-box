[package]
name = "go-box-client"
description = "The go-box game client: runs in the browser (wasm32), or natively for testing."
version.workspace = true
edition.workspace = true

[[bin]]
name = "go-box-client"
path = "src/main.rs"

[dependencies]
go-box-protocol.workspace = true
go-box-render.workspace = true
go-box-sim.workspace = true
macroquad.workspace = true
rand.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.26"
