[package]
name = "go-box-server"
description = "Runs go-box rooms and matches for browser clients over WebSockets."
version.workspace = true
edition.workspace = true

[[bin]]
name = "go-box-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
go-box-protocol.workspace = true
go-box-sim.workspace = true
rand = { workspace = true, features = ["std", "std_rng"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
glam.workspace = true
tokio-tungstenite = "0.26"
