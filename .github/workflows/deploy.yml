# On every push and pull request: run the tests, and build the Docker image and check it starts.
# On a push to main, if both pass: push that exact image to Fly's registry and deploy it (nothing
# is built twice). Deploying needs the FLY_API_TOKEN repository secret (docs/DEPLOY.md); without
# it, pushes just test.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The native test client links against the desktop's audio and graphics libraries.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - name: Tests
        run: cargo test --release --locked --workspace
      - name: Browser client builds
        run: cargo build --release --locked -p go-box-client --target wasm32-unknown-unknown

  # The image Fly runs: built once here (reusing cached layers from earlier runs), checked, and on
  # main pushed to Fly's registry tagged with the commit, for the deploy job to start.
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.fly.io/go-box:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: It starts and answers its health check
        run: |
          docker run -d --name go-box -p 8080:8080 "$IMAGE"
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs go-box
          exit 1
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - name: Push it to Fly's registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::No FLY_API_TOKEN secret yet, so not pushing (see docs/DEPLOY.md)."
            exit 0
          fi
          flyctl auth docker
          docker push "$IMAGE"

  deploy:
    needs: [test, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits for the one in progress.
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::No FLY_API_TOKEN secret yet, so not deploying (see docs/DEPLOY.md)."
            exit 0
          fi
          # The image the image job built and checked. One machine only: rooms live in its memory.
          flyctl deploy --image "registry.fly.io/go-box:${{ github.sha }}" --ha=false
